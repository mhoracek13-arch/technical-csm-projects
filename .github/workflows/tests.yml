name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the package actually installs
        run: pip install .

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test the CLI and demos
        run: |
          python -m capacity_guardian.cli --offline > /dev/null || [ $? -eq 1 ]
          python -m capacity_guardian.cli --offline --format json > /dev/null || [ $? -eq 1 ]
          python -m capacity_guardian.cli --offline --work-days 20 > /dev/null
          python demos/meeting_actions.py > /dev/null
          python demos/churn_signals.py > /dev/null
          python demos/portfolio_health.py > /dev/null
