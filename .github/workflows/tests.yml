name: tests

on:
  push:
    # Both, so the workflow fires whichever name the default branch has.
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Testing the oldest supported version and the newest catches the
        # syntax and stdlib differences that bite in between.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the package actually installs
        run: pip install .

      - name: Run tests
        run: python -m pytest

          - name: Smoke-test the CLI and demos
        # The bundled fixtures contain an overload the team cannot absorb, so
        # the documented exit code is 1, not 0. Assert exact codes rather than
        # tolerating any failure: a permissive "|| true" would happily pass
        # while the CLI crashed with 3 (API error) or 4 (bad fixtures).
        run: |
          expect_exit() {
            local want=$1; shift
            set +e; "$@" > /dev/null; local got=$?; set -e
            if [ "$got" -ne "$want" ]; then
              echo "::error::'$*' exited $got, expected $want"; exit 1
            fi
          }
          expect_exit 1 python -m capacity_guardian.cli --offline
          expect_exit 1 python -m capacity_guardian.cli --offline --format json
          expect_exit 0 python -m capacity_guardian.cli --offline --work-days 20
          expect_exit 0 python demos/meeting_actions.py
          expect_exit 0 python demos/churn_signals.py
          expect_exit 0 python demos/portfolio_health.py
